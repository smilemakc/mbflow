version: "2"

run:
  timeout: 5m
  go: "1.25"
  tests: true

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
      colors: true
  sort-order:
    - file
    - linter

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck # includes former gosimple and stylecheck in v2
    - unused
    - ineffassign
    - gocritic
    - revive
    - misspell

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow

    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close

    staticcheck:
      # golangci-lint v2 default set (SA + S + most ST checks).
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - unnamedResult
        - hugeParam
        - rangeValCopy
        - exitAfterDefer

    revive:
      severity: warning
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: if-return
        - name: increment-decrement
        - name: var-naming
          arguments:
            - ["ID", "URL", "HTTP", "API", "JSON", "XML", "SQL", "UUID", "UI", "DB", "RPC", "GRPC"]
        - name: var-declaration
        - name: package-comments
          disabled: true
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
          disabled: true
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
        - name: unreachable-code
        - name: redefines-builtin-id

    misspell:
      locale: US
      ignore-rules:
        - cancelled

  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party
      - testdata
      - examples
      - ".*\\.pb\\.go$"
      - ".*\\.gen\\.go$"
      - ".*_gen\\.go$"
      - "mock_.*\\.go$"
      - "(^|/)pb/"
    rules:
      # Relax some linters on test files
      - path: _test\.go
        linters:
          - errcheck
          - gocritic

      # Allow underscores in test function names
      - path: _test\.go
        text: "should not use underscores in Go names"

      # Exclude revive exported check for main packages
      - path: cmd/
        linters:
          - revive
        text: "should have comment or be unexported"

      # Gin handlers: allow unused parameters
      - path: internal/controller/
        text: "unused-parameter"
        linters:
          - revive

      # Allow blank imports for database drivers and gRPC
      - source: "_ \"github.com/"
        linters:
          - revive
          - staticcheck

      - text: "should have a package comment"
        linters:
          - revive
          - staticcheck

      # Exclude error shadowing in some cases
      - text: "shadow: declaration of \"err\""
        linters:
          - govet

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/smilemakc/mbflow
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party
      - testdata
      - examples
      - ".*\\.pb\\.go$"
      - ".*\\.gen\\.go$"
      - ".*_gen\\.go$"
      - "mock_.*\\.go$"

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  uniq-by-line: true
  new: false
  fix: false

severity:
  default: warning
