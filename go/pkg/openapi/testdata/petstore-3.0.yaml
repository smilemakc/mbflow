openapi: 3.0.3
info:
  title: Petstore
  description: Sample pet store API
  version: 1.2.0
servers:
  - url: "{scheme}://api.petstore.test/{version}/"
    description: Production
    variables:
      scheme:
        default: https
        enum: [https, http]
      version:
        default: v1
  - url: /relative
security:
  - api_key: []
tags:
  - name: pets
paths:
  /pets:
    get:
      operationId: listPets
      summary: List pets
      tags: [pets]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
        - name: tags
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
        - name: filter
          in: query
          style: deepObject
          schema:
            type: object
            properties:
              status:
                type: string
        - name: Accept
          in: header
          schema:
            type: string
      responses:
        "200":
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create a pet
      tags: [pets]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/NewPet"
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
            example:
              name: Rex
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
  /pets/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
      - name: X-Trace-Id
        in: header
        schema:
          type: string
    get:
      operationId: getPet
      tags: [pets]
      parameters:
        - name: petId
          in: path
          required: true
          description: Overridden at operation level
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: A pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      operationId: deletePet
      tags: [pets]
      security: []
      responses:
        "204":
          description: Deleted
  /health:
    get:
      operationId: listPets
      responses:
        "200":
          description: Duplicate operationId on purpose
components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-API-Key
    basic:
      type: http
      scheme: basic
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        age:
          type: integer
        vaccinated:
          type: boolean
        tags:
          type: array
          items:
            type: string
        category:
          $ref: "#/components/schemas/Category"
    Pet:
      allOf:
        - $ref: "#/components/schemas/NewPet"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    Category:
      type: object
      properties:
        name:
          type: string
        parent:
          $ref: "#/components/schemas/Category"
    Error:
      type: object
      properties:
        message:
          type: string
    Unused:
      type: object
      properties:
        never:
          type: string
